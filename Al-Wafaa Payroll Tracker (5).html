<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Al-Wafaa Payroll Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: sticky project bar + tab rail, then a 12-col dashboard grid of cards; drawers slide in from the right for record work. */
:root{
  --bg:#ffffff; --surface:#ffffff; --surface-2:#f4f7f5; --ink:#2b2b2d; --muted:#6b6e72; --line:#e6ebe8;
  --brand:#7DA68E; --gold:#FF7B5C; --coral:#FF7B5C; --charcoal:#414042; --on-brand:#2b2b2d;
  --accent:#4f8068; --accent-soft:#e9f2ec; --on-accent:#ffffff;
  --who:#3a86c8; --who-soft:#e3eff9; --ha:#7DA68E; --ha-soft:#e9f2ec;
  --ok:#2f8a5f; --ok-soft:#e2f3ea; --warn:#c07612; --warn-soft:#fdf1df; --bad:#d64532; --bad-soft:#fde6e2; --info:#5a62c6; --info-soft:#eceefb;
  --paper:#ffffff; --paper-ink:#2b2b2d; --paper-line:#e1e5e3;
  --shadow:0 1px 2px rgba(40,50,45,.05),0 12px 32px -16px rgba(40,60,50,.22);
  --f-display:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:14px; color-scheme:light;
}
*{box-sizing:border-box}
body{background:#fafbfa;color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.5;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:#ffffff}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(255,255,255,.94);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);color:var(--ink);border-bottom:1px solid var(--line);box-shadow:0 8px 24px -20px rgba(40,60,50,.35)}
.top-row{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:14px 10px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1 1 320px}
.mark{width:42px;height:42px;border-radius:12px;background:var(--gold);color:var(--brand);display:grid;place-items:center;flex:none;font-family:var(--f-display);font-weight:700;font-size:16px;letter-spacing:.02em}
.logo-pill{display:flex;align-items:center;flex:none;height:46px;padding-right:18px;border-right:1px solid var(--line)}
.logo-pill img,.logo-pill svg{height:44px;width:auto;max-width:170px;display:block}
.brand h1{font-family:var(--f-display);font-size:19px;font-weight:700;color:var(--charcoal);margin:0;letter-spacing:-.01em;line-height:1.15;text-wrap:balance}
.brand p{margin:0;font-size:12.5px;color:var(--muted)}
.top-ctrls{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.monthpick{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 14px}
.monthpick label{font-size:12px;color:var(--muted)}
.monthpick select{border:0;background:transparent;font-weight:700;padding:4px 4px;cursor:pointer;color:var(--charcoal)}
.monthpick select option{color:#0f1c26;background:#fff}
.prog{display:flex;gap:3px}
.prog i{width:14px;height:6px;border-radius:3px;background:var(--line)}
.prog i.on{background:var(--brand)} .prog i.cur{background:var(--coral);box-shadow:0 0 0 2px color-mix(in srgb,var(--coral) 25%,transparent)}
.top .btn.primary{background:var(--coral);border-color:var(--coral);color:#ffffff;font-weight:700;box-shadow:0 6px 16px -8px var(--coral)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.wordmark{display:flex;align-items:center;gap:10px;flex:none;padding-right:16px;margin-right:2px;border-right:1px solid color-mix(in srgb,var(--on-brand) 18%,transparent)}
.wordmark svg{width:24px;height:36px;flex:none}
.wordmark span{font-family:var(--f-body);font-size:12px;letter-spacing:.32em;line-height:1.25;font-weight:500;color:var(--on-brand)}
@media (max-width:560px){.wordmark span{display:none}.wordmark{padding-right:10px}}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:500;cursor:pointer;transition:background .15s,border-color .15s,transform .1s;white-space:nowrap}
.btn:hover{background:var(--surface-2)} .btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08);background:var(--accent)}
.btn.sm{padding:4px 11px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn svg{width:15px;height:15px}
.btn[disabled]{opacity:.45;pointer-events:none}
.sub-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding-block:0 0}
.top .seg{margin-block:4px}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-bottom:-1px}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 14px 12px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;transition:color .15s,border-color .2s}
.tab:hover{color:var(--charcoal)}
.tab[aria-current="page"]{color:var(--charcoal);border-bottom-color:var(--brand)}
.tab .cnt{font-family:var(--f-mono);font-size:11px;background:var(--bad-soft);color:var(--bad);border-radius:999px;padding:0 6px;margin-left:5px}
.seg{display:flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap;transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.dot.who{background:var(--who)} .dot.ha{background:var(--ha)} .dot.all{background:linear-gradient(90deg,var(--who) 50%,var(--ha) 50%)}

/* banner */
.banner{margin-top:16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;background:var(--info-soft);border:1px solid color-mix(in srgb,var(--info) 30%,transparent);border-radius:var(--r);padding:12px 16px}
.banner b{font-weight:600}
.banner .grow{flex:1 1 300px;min-width:0}
.banner.live{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 30%,transparent)}

/* layout */
main{padding-block:20px 60px}
.enter > *{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
.enter > *:nth-child(2){animation-delay:.05s}.enter > *:nth-child(3){animation-delay:.1s}.enter > *:nth-child(4){animation-delay:.15s}.enter > *:nth-child(5){animation-delay:.2s}.enter > *:nth-child(6){animation-delay:.25s}
@keyframes rise{from{opacity:.001;transform:translateY(8px)}to{opacity:1;transform:none}}
.vhead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.vhead h2{font-family:var(--f-display);font-size:26px;font-weight:700;letter-spacing:-.02em;margin:0;line-height:1.1;text-wrap:balance}
.vhead p{margin:4px 0 0;color:var(--muted)}
.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;margin-bottom:16px}
.c12{grid-column:span 12}.c8{grid-column:span 8}.c7{grid-column:span 7}.c6{grid-column:span 6}.c5{grid-column:span 5}.c4{grid-column:span 4}.c3{grid-column:span 3}
@media (max-width:1060px){.c8,.c7,.c5{grid-column:span 12}.c4{grid-column:span 6}.c3{grid-column:span 6}}
@media (max-width:640px){.c6,.c4,.c3{grid-column:span 12}.vhead h2{font-size:22px}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;min-width:0}
.card h3{font-family:var(--f-display);font-weight:600;font-size:16.5px;margin:0;letter-spacing:-.01em}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.card-h p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}

/* KPI */
.kpi{position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--brand),var(--brand) 70%,var(--coral))}
.card{box-shadow:0 1px 2px rgba(15,28,38,.04)}
.vhead h2{color:var(--ink)}
.eyebrow{color:var(--accent)!important}
.card{border-color:var(--line);box-shadow:0 1px 2px rgba(40,50,45,.04),0 10px 30px -24px rgba(40,60,50,.3)}
.card:hover{box-shadow:0 1px 2px rgba(40,50,45,.05),0 14px 34px -22px rgba(40,60,50,.35)}
.kpi .val{color:var(--charcoal)}
.vhead h2{color:var(--charcoal);font-weight:800}
.brandprev{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brandprev .bx{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 16px;display:flex;align-items:center;gap:12px;min-width:0}
.sw{display:flex;align-items:center;gap:8px}.sw input[type=color]{width:44px;height:34px;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--surface);cursor:pointer}
.kpi .lbl{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.kpi .val{font-family:var(--f-display);font-weight:700;font-size:38px;letter-spacing:-.03em;line-height:1.1;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.kpi .val small{font-size:20px;color:var(--muted);font-weight:600;margin-left:4px}
.kpi .sub{font-size:12.5px;color:var(--muted)}
.meter{height:6px;border-radius:3px;background:var(--surface-2);margin-top:12px;position:relative;overflow:visible}
.meter > i{position:absolute;inset:0 auto 0 0;width:var(--w);border-radius:3px;background:var(--accent);transform-origin:left}
.meter > i.ok{background:var(--ok)}.meter > i.warn{background:var(--warn)}.meter > i.bad{background:var(--bad)}
.meter > b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);left:var(--x);border-radius:1px}
.enter .meter > i,.enter .fbar > i{animation:grow .9s .15s cubic-bezier(.2,.7,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;border-radius:999px;padding:1px 8px;line-height:1.6}
.tag.ok{background:var(--ok-soft);color:var(--ok)}.tag.warn{background:var(--warn-soft);color:var(--warn)}.tag.bad{background:var(--bad-soft);color:var(--bad)}

/* funnel */
.funnel{display:grid;gap:12px}
.frow{display:grid;grid-template-columns:150px minmax(0,1fr) 56px;align-items:center;gap:12px;border:0;background:none;padding:4px 6px;margin:0 -6px;border-radius:8px;cursor:pointer;text-align:left}
.frow:hover{background:var(--surface-2)}
.fbar{height:12px;border-radius:6px;background:var(--surface-2);position:relative;overflow:hidden}
.fbar > i{position:absolute;inset:0 auto 0 0;width:var(--w);background:var(--accent);border-radius:6px;transform-origin:left}
.frow .num{text-align:right;font-size:15px}
@media (max-width:520px){.frow{grid-template-columns:110px minmax(0,1fr) 44px}}

/* attention */
.alist{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.aitem{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;background:var(--surface);width:100%;text-align:left;transition:border-color .15s,background .15s}
.aitem:hover{background:var(--surface-2)}
.sev{width:4px;align-self:stretch;border-radius:2px;flex:none}
.sev.bad{background:var(--bad)}.sev.warn{background:var(--warn)}.sev.info{background:var(--info)}.sev.ok{background:var(--ok)}
.aitem .t{flex:1;min-width:0}
.aitem .t b{display:block;font-weight:600;font-size:13.5px}
.aitem .t span{font-size:12px;color:var(--muted)}
.aitem .n{font-family:var(--f-mono);font-size:18px}

/* column chart */
.cc-wrap{position:relative;padding-top:6px}
.cc{position:relative;height:190px;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:12px;border-bottom:1px solid var(--line)}
.cc-col{height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;min-width:0}
.cc-val{font-family:var(--f-mono);font-size:12px;font-weight:500}
.cc-stack{width:min(52px,72%);height:var(--h);display:flex;flex-direction:column-reverse;border-radius:6px 6px 0 0;overflow:hidden;transform-origin:bottom}
.enter .cc-stack{animation:up .8s cubic-bezier(.2,.7,.2,1) both}
.cc-col:nth-child(2) .cc-stack{animation-delay:.06s}.cc-col:nth-child(3) .cc-stack{animation-delay:.12s}.cc-col:nth-child(4) .cc-stack{animation-delay:.18s}.cc-col:nth-child(5) .cc-stack{animation-delay:.24s}.cc-col:nth-child(6) .cc-stack{animation-delay:.3s}
@keyframes up{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.cc-stack i{display:block;min-height:0}
.cc-stack i.who{background:var(--who)}.cc-stack i.ha{background:var(--ha)}.cc-stack i.acc{background:var(--accent)}
.cc-col.fut .cc-stack{border:1.5px dashed var(--line);border-bottom:0;background:transparent}
.cc-col.sel .cc-val{color:var(--accent)}
.cc-target{position:absolute;left:0;right:0;border-top:1.5px dashed var(--muted);pointer-events:none}
.cc-target span{position:absolute;right:0;top:-20px;font-size:11.5px;color:var(--muted);background:var(--surface);padding-left:6px}
.cc-x{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:12px;margin-top:6px;text-align:center;font-size:12px;color:var(--muted)}
.cc-x b{color:var(--ink);font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}

/* tables */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.search{flex:1 1 220px;min-width:0;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:7px 14px;background:var(--surface)}
.search input{border:0;outline:0;background:transparent;width:100%;min-width:0}
.search svg{width:15px;height:15px;color:var(--muted);flex:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:12.5px;cursor:pointer;color:var(--muted);transition:all .15s}
.chip b{font-family:var(--f-mono);font-weight:500;margin-left:4px;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%}
.tw table{min-width:940px}
th{font-size:12px;font-weight:600;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface);position:sticky;top:0}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer;transition:background .12s}
tbody tr.click:hover{background:var(--surface-2)}
tbody tr.selrow{background:var(--accent-soft)}
td.r,th.r{text-align:right}
tfoot td{font-weight:600;border-top:2px solid var(--line);border-bottom:0}
.idc{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.nm{font-weight:500}
.st{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:999px;padding:2px 10px;white-space:nowrap}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st.pending{background:var(--surface-2);color:var(--muted)}
.st.received{background:var(--info-soft);color:var(--info)}
.st.verified{background:var(--accent-soft);color:var(--accent)}
.st.approved{background:var(--warn-soft);color:var(--warn)}
.st.paid{background:var(--ok-soft);color:var(--ok)}
.st.returned{background:var(--bad-soft);color:var(--bad)}
.fund{font-size:11.5px;font-weight:600;border-radius:6px;padding:1px 7px}
.fund.WHO{background:var(--who-soft);color:var(--who)}.fund.HA{background:var(--ha-soft);color:var(--ha)}
.docs{display:inline-flex;gap:4px}
.doc{font-size:10.5px;font-weight:600;border-radius:4px;padding:1px 5px;border:1px solid var(--line);color:var(--muted)}
.doc.on{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.dl{font-size:12.5px;white-space:nowrap}
.dl.bad{color:var(--bad);font-weight:600}.dl.warn{color:var(--warn);font-weight:600}.dl.ok{color:var(--ok)}
.mdots{display:inline-flex;gap:3px}
.mdots i{width:12px;height:12px;border-radius:3px;background:var(--surface-2);border:1px solid var(--line)}
.mdots i.paid{background:var(--ok);border-color:var(--ok)}.mdots i.mid{background:var(--warn);border-color:var(--warn)}.mdots i.ret{background:var(--bad);border-color:var(--bad)}.mdots i.na{background:transparent;border-style:dashed}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}
.bulk{position:sticky;bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:5;margin-top:12px;display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--ink);color:var(--bg);border-radius:999px;padding:8px 10px 8px 18px;box-shadow:var(--shadow);animation:rise .25s both}
.bulk .btn{background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 35%,transparent)}
.bulk .btn:hover{background:color-mix(in srgb,var(--bg) 14%,transparent)}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}

/* heatmap */
.heat{display:grid;gap:4px;font-size:12px}
.heat .hc{border-radius:6px;padding:7px 4px;text-align:center;font-family:var(--f-mono);background:color-mix(in srgb,var(--accent) var(--p),var(--surface-2))}
.heat .hc.hi{color:var(--on-accent)}
.heat .hc.none{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.heat .hl{display:flex;align-items:center;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* forms */
.field{display:grid;gap:5px;min-width:0}
.field label,.flabel{font-size:12px;font-weight:600;color:var(--muted)}
.inp{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);min-width:0}
.inp:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
textarea.inp{resize:vertical;min-height:70px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.check{display:flex;align-items:center;gap:8px;font-weight:500;cursor:pointer}
.inline-num{width:90px;text-align:right;font-family:var(--f-mono)}
.hint{font-size:12px;color:var(--muted)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(8,20,18,.42);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(580px,100%);background:var(--surface);z-index:41;display:flex;flex-direction:column;transform:translateX(102%);transition:transform .32s cubic-bezier(.2,.7,.2,1);box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer.on{transform:none}
.dh{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px 22px 14px;border-bottom:1px solid var(--line)}
.dh h3{font-family:var(--f-display);font-size:20px;margin:0;letter-spacing:-.01em}
.dh p{margin:3px 0 0;font-size:12.5px;color:var(--muted)}
.db{flex:1;overflow-y:auto;padding:18px 22px;display:grid;gap:18px;align-content:start}
.df{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;padding:14px 22px;border-top:1px solid var(--line)}
.sect{display:grid;gap:10px}
.sect > h4{margin:0;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stp{border-radius:10px;padding:9px 10px;background:var(--surface-2);font-size:12px;min-width:0}
.stp b{display:block;font-size:12.5px}
.stp span{color:var(--muted);font-family:var(--f-mono);font-size:11.5px}
.stp.done{background:var(--ok-soft)} .stp.done b{color:var(--ok)}
.stp.now{background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent)}
@media (max-width:460px){.steps{grid-template-columns:repeat(2,1fr)}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.filebox{display:flex;align-items:center;gap:10px;border:1px dashed var(--line);border-radius:10px;padding:10px 12px}
.filebox .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.filebox a{color:var(--accent)}
.hist{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:12.5px}
.hist li{display:flex;gap:10px}.hist li span{color:var(--muted);font-family:var(--f-mono);min-width:86px}
.alert{border-radius:10px;padding:10px 12px;font-size:13px}
.alert.bad{background:var(--bad-soft);color:var(--bad)}.alert.warn{background:var(--warn-soft);color:var(--warn)}.alert.ok{background:var(--ok-soft);color:var(--ok)}

/* dialog */
.dlg{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px}
.dlg-box{background:var(--surface);border-radius:16px;max-width:440px;width:100%;padding:22px;box-shadow:var(--shadow);animation:rise .2s both}
.dlg-box h3{margin:0 0 6px;font-family:var(--f-display)}
.dlg-box p{margin:0 0 16px;color:var(--muted)}
.dlg-bg{position:absolute;inset:0;background:rgba(8,20,18,.45)}

/* toasts */
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:70;display:grid;gap:8px;justify-items:center;pointer-events:none;width:max-content;max-width:calc(100% - 32px)}
.toast{background:var(--ink);color:var(--bg);border-radius:999px;padding:9px 18px;font-size:13px;box-shadow:var(--shadow);animation:toast 3.2s both}
.toast.bad{background:var(--bad);color:#fff}
@keyframes toast{0%{opacity:0;transform:translateY(10px)}8%,85%{opacity:1;transform:none}100%{opacity:0}}

/* WHO paper */
.paper{background:var(--paper);color:var(--paper-ink);border-radius:6px;padding:40px 44px;box-shadow:var(--shadow);border:1px solid var(--line);font-size:13px;max-width:980px;margin:0 auto}
.paper h1{font-family:var(--f-display);font-size:22px;margin:0 0 4px;letter-spacing:-.01em}
.paper h2{font-size:14px;margin:26px 0 8px;padding-bottom:5px;border-bottom:2px solid var(--paper-ink)}
.paper .meta{color:#555d5a;font-size:12.5px;margin:0}
.paper table{min-width:640px;font-size:12px}
.paper th{background:#f1f4f3;color:#30403b;position:static;border-bottom:1px solid var(--paper-line)}
.paper td{border-bottom:1px solid var(--paper-line)}
.paper tfoot td{border-top:2px solid var(--paper-ink)}
.paper .ptw{overflow-x:auto}
.paper .note{font-size:11.5px;color:#555d5a}
@media (max-width:640px){.paper{padding:22px 18px}}
.deliv{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.dv{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.dv .eyebrow{display:block;margin-bottom:4px}
.dv b{font-family:var(--f-display);font-size:22px}
.dv p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.ro .w{display:none!important}
.no-staff .ws,.no-reports .wr,.no-pay .wp,.no-finance .wf,.no-settings .wa,.no-upload .wu,.no-users .wx{display:none!important}
.gate{position:fixed;inset:0;z-index:100;background:#ffffff;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px));overflow:auto;transition:opacity .45s ease,visibility .45s}
.gate.out{opacity:0;visibility:hidden;pointer-events:none}
.gate::before,.gate::after{content:"";position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;pointer-events:none}
.gate::before{width:520px;height:520px;background:color-mix(in srgb,var(--brand) 38%,#fff);top:-180px;left:-160px;animation:drift 14s ease-in-out infinite alternate}
.gate::after{width:420px;height:420px;background:color-mix(in srgb,var(--coral) 26%,#fff);bottom:-160px;right:-120px;animation:drift 16s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate(60px,40px) scale(1.08)}}
.gate-card{position:relative;z-index:1;width:min(440px,100%);background:rgba(255,255,255,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:22px;padding:36px 34px 28px;box-shadow:0 30px 80px -40px rgba(40,60,50,.45);animation:rise .6s cubic-bezier(.2,.7,.2,1) both;text-align:center}
.gate-logo svg,.gate-logo img{height:64px;width:auto;margin:0 auto 22px;display:block}
.gate-card h2{font-family:var(--f-display);font-weight:800;font-size:24px;letter-spacing:-.02em;margin:0 0 6px;color:var(--charcoal)}
.gate-card > p{margin:0 0 24px;color:var(--muted)}
.gate-id{display:flex;align-items:center;gap:12px;text-align:left;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:16px;background:#fff}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;flex:none;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.gate-id b{display:block;color:var(--charcoal)} .gate-id span{font-size:12.5px;color:var(--muted)}
.gate .btn.big{width:100%;justify-content:center;padding:12px 18px;font-size:15px;border-radius:12px}
.spin{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--brand);animation:sp .8s linear infinite;margin:6px auto 14px}
@keyframes sp{to{transform:rotate(360deg)}}
.gate-foot{margin-top:20px;font-size:12px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}
.gate-foot svg{width:14px;height:14px}
.userchip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 12px 3px 3px;cursor:pointer;font-size:13px}
.userchip .avatar{width:30px;height:30px;font-size:12px}
.userchip small{display:block;color:var(--muted);font-size:11px;line-height:1.1}
.userchip b{font-weight:600;line-height:1.1}
.rolepill{font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--accent-soft);color:var(--accent)}
.rolepill.admin{background:var(--charcoal);color:#fff}.rolepill.finance{background:var(--who-soft);color:var(--who)}.rolepill.hr{background:var(--warn-soft);color:var(--warn)}.rolepill.viewer{background:var(--surface-2);color:var(--muted)}
.matrix td,.matrix th{text-align:center}.matrix td:first-child,.matrix th:first-child{text-align:left}
.yes{color:var(--ok);font-weight:700}.no{color:var(--line)}
.results{display:grid;gap:6px;margin-top:8px}
.result{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.result .t{flex:1;min-width:0}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ============ metrics ============ */
function metrics(m,f=S.fund){
  const L=+cfg().paymentLimitDays||7,t=todayISO();const list=fStaff(f).filter(s=>active(s,m));
  const o={m,active:list.length,cnt:{pending:0,received:0,verified:0,approved:0,paid:0,returned:0},rcvd:0,ver:0,app:0,paid:0,days:[],onTime:0,overdue:[],dueSoon:[],missingDocs:[],returned:[],notSubmitted:[],att:0,wd:0,hrs:0,ses:0,ben:0,sesW:0,sesH:0,benW:0,benH:0,attW:0,attH:0,wdW:0,wdH:0,reported:0};
  const due=dueDate(m);
  for(const s of list){const r=rec(m,s.id),st=r.st||'pending',i=stageIdx(st);o.cnt[st]=(o.cnt[st]||0)+1;
    if(i>=1)o.rcvd++;if(i>=2&&st!=='returned')o.ver++;if(i>=3)o.app++;
    if(st==='paid'){o.paid++;if(r.rcv&&r.paid){const d=dDiff(r.rcv,r.paid);o.days.push(d);if(d<=L)o.onTime++}}
    else if(r.rcv&&st!=='pending'&&st!=='returned'){const left=L-dDiff(r.rcv,t);if(left<0)o.overdue.push(s);else if(left<=2)o.dueSoon.push(s)}
    if(st==='returned')o.returned.push(s);
    if(st==='pending'&&t>due)o.notSubmitted.push(s);
    if(i>=1&&st!=='returned'&&(!r.tech||!r.ts))o.missingDocs.push(s);
    if(i>=1){o.reported++;const a=+r.att||0,w=+r.wd||0;o.att+=a;o.wd+=w;o.hrs+=+r.hrs||0;o.ses+=+r.ses||0;o.ben+=+r.ben||0;
      if(s.funding==='WHO'){o.sesW+=+r.ses||0;o.benW+=+r.ben||0;o.attW+=a;o.wdW+=w}else{o.sesH+=+r.ses||0;o.benH+=+r.ben||0;o.attH+=a;o.wdH+=w}}}
  o.avgDays=o.days.length?o.days.reduce((a,b)=>a+b,0)/o.days.length:null;
  o.onTimePct=o.paid?o.onTime/o.paid:null;o.attPct=o.wd?o.att/o.wd:null;
  return o}
function sumCost(c){return c?(+c.bank||0)+(+c.other||0):0}
function fin(m,f){
  let sal=0,ils=0,usdN=0,n=0,committed=0;
  for(const s of staffList()){if(f!=='all'&&s.funding!==f)continue;const r=rec(m,s.id);
    if(r.st==='paid'){const a=r.amt??s.fee,c=r.cur||s.currency;sal+=usd(a,c);if(c==='ILS')ils+=+a;else usdN+=+a;n++}
    else if(active(s,m)&&['received','verified','approved'].includes(r.st))committed+=usd(s.fee,s.currency)}
  const oh=sal*(+cfg().overheadPct||0)/100,vat=vatOn(sal,oh);const c=(S.months[m]||{}).costs||{};
  const other=f==='all'?sumCost(c.WHO)+sumCost(c.HA):sumCost(c[f]);
  return {sal,ils,usdN,n,committed,oh,vat,other,total:sal+oh+vat+other}}
function mult(){const oh=(+cfg().overheadPct||0)/100,v=(+cfg().vatPct||0)/100;return cfg().vatBase==='overhead'?1+oh+oh*v:(1+oh)*(1+v)}
function plannedSalaries(f,dept){let t=0;const ms=monthList();for(const s of staffList()){if(f!=='all'&&s.funding!==f)continue;if(dept&&s.dept!==dept)continue;for(const m of ms)if(active(s,m))t+=usd(s.fee,s.currency)}return t}
function budgetFor(f){if(f==='all')return budgetFor('WHO')+budgetFor('HA');const b=cfg().budget&&cfg().budget[f];return b?+b:plannedSalaries(f)*mult()}
function spentTo(f,upto){let t=0;for(const m of monthList()){if(upto&&m>upto)break;t+=fin(m,f).total}return t}

function applyBrand(){const b=brand(),r=document.documentElement.style;r.setProperty('--brand',b.primary);r.setProperty('--coral',b.gold);r.setProperty('--ha',b.primary);
  const img=$('#brandLogo');if(b.logo){if(img.getAttribute('src')!==b.logo)img.src=b.logo;img.hidden=false;$('#brandMark').hidden=true}else{img.hidden=true;$('#brandMark').hidden=false}}
function countUp(root){if(reduce)return;root.querySelectorAll('[data-count]').forEach(el=>{const to=+el.dataset.count,d=+el.dataset.dec,pre=el.dataset.pre,suf=el.dataset.suf;const t0=performance.now();
  const f=t=>{const p=Math.min(1,(t-t0)/850),e=1-Math.pow(1-p,3);el.textContent=pre+fmtN(to*e,d)+suf;if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)})}
function defaultMonth(){const ms=monthList();let best=ms[0];for(const m of ms){const r=(S.months[m]||{}).records||{};if(Object.values(r).some(x=>x.st&&x.st!=='pending'))best=m}return best}
function refreshRole(){if(!S.entered)return;const r=window.claude&&window.claude.use&&S.db?roleOf():'admin';if(r!==S.role){S.role=r;if(!r){S.entered=false;renderGate()}}}
function renderBanner(){
  const h=$('#bannerWrap');
  if(S.mode==='live'){h.innerHTML='';return}
  const canSetup=S.db&&S.dbReady&&S.canWrite!==false;
  h.innerHTML=`<div class="banner"><div class="grow"><b>You are looking at sample data.</b> ${S.db?(S.dbReady?'Names and figures are invented so you can try every screen. Changes stay in this tab until you set up the shared database.':'Connecting to the shared database…'):'Changes stay in this tab only; the shared database is not available in this view.'}</div>
  ${canSetup&&can('settings')?`<button class="btn sm primary" data-act="import-staff">${IC.up}Import staff list (CSV)</button><button class="btn sm" data-act="seed-sample">Keep sample as starting point</button><button class="btn sm" data-act="start-empty">Start empty</button>`:''}</div>`}

/* ============ Overview ============ */
function tile(lbl,val,sub,meter){return `<div class="card kpi c3"><div class="lbl">${lbl}</div><div class="val">${val}</div><div class="sub">${sub}</div>${meter||''}</div>`}
function vOverview(){
  const m=S.month,M=metrics(m),ms=monthList(),mi=ms.indexOf(m),L=+cfg().paymentLimitDays||7;
  const bud=budgetFor(S.fund),spent=spentTo(S.fund),bp=bud?spent/bud:0,expected=(mi+1)/ms.length;
  const avg=M.avgDays,avgCls=avg==null?'':avg<=L*.8?'ok':avg<=L?'warn':'bad';
  const ot=M.onTimePct;
  const kpis=`<section class="grid">
   ${tile('Staff paid · '+mLabel(m),`${num(M.paid)}<small>/ ${M.active}</small>`,`${M.active-M.paid} not yet paid · ${M.cnt.pending} awaiting report`,`<div class="meter"><i class="ok" style="--w:${M.active?M.paid/M.active*100:0}%"></i></div>`)}
   ${tile('Avg. days, report to payment',avg==null?'—':num(avg,{dec:1}),`ToR limit: ${L} days`,avg==null?'':`<div class="meter"><i class="${avgCls}" style="--w:${Math.min(100,avg/(L*1.5)*100)}%"></i><b style="--x:${100/1.5}%" title="Limit"></b></div>`)}
   ${tile('Paid on time',ot==null?'—':num(ot*100,{dec:ot<1&&ot>.99?1:0,suf:'%'}),`within ${L} days of receiving the report`,ot==null?'':`<div class="meter"><i class="${ot>=.98?'ok':ot>=.9?'warn':'bad'}" style="--w:${ot*100}%"></i></div>`)}
   ${tile('Budget spent',num(bp*100,{suf:'%'}),`${usdS(spent)} of ${usdS(bud)} · month ${mi+1} of ${ms.length}`,`<div class="meter"><i class="${bp>expected*1.05?'warn':''}" style="--w:${Math.min(100,bp*100)}%"></i><b style="--x:${expected*100}%" title="Expected by this month"></b></div>`)}
  </section>`;
  const fr=(l,v,st)=>`<button class="frow" data-goto="reports" data-stage="${st}"><span>${l}</span><span class="fbar"><i style="--w:${M.active?v/M.active*100:0}%"></i></span><span class="num">${v}</span></button>`;
  const funnel=`<div class="card c6"><div class="card-h"><div><h3>Payroll status · ${mFull(m)}</h3><p>${M.active} staff active this month · reports due by ${fmtDate(dueDate(m))}</p></div><button class="btn sm" data-goto="reports" data-stage="all">Open register</button></div>
   <div class="funnel">${fr('Reports received',M.rcvd,'all')}${fr('Verified',M.ver,'verified')}${fr('Approved',M.app,'approved')}${fr('Paid by bank',M.paid,'paid')}</div>
   <p class="hint" style="margin:14px 0 0">Click a stage to see the staff in it.</p></div>`;
  const items=[];
  if(M.overdue.length)items.push(['bad','Payments past the '+L+'-day limit','Reports received more than '+L+' days ago and still unpaid',M.overdue.length,'overdue']);
  if(M.dueSoon.length)items.push(['warn','Payment due within 2 days','Approve and pay these to stay inside the ToR limit',M.dueSoon.length,'duesoon']);
  if(M.returned.length)items.push(['warn','Reports returned for correction','Waiting for the staff member to resubmit',M.returned.length,'returned']);
  if(M.notSubmitted.length)items.push(['warn','Reports not submitted','Due date '+fmtDate(dueDate(m))+' has passed',M.notSubmitted.length,'pending']);
  else if(M.cnt.pending)items.push(['info','Awaiting report','Not yet due · due by '+fmtDate(dueDate(m)),M.cnt.pending,'pending']);
  if(M.missingDocs.length)items.push(['info','Incomplete documents','Technical report or timesheet missing',M.missingDocs.length,'missing']);
  const soon=fStaff().filter(s=>s.active!==false&&s.end&&s.end>=todayISO()&&dDiff(todayISO(),s.end)<=30);
  if(soon.length)items.push(['info','Contracts ending within 30 days','Check renewals or replacements',soon.length,'staff']);
  const att=`<div class="card c6"><div class="card-h"><div><h3>Needs attention</h3><p>As of ${fmtDate(todayISO())}</p></div></div>
   ${items.length?`<ul class="alist">${items.map(([s,t,d,n,go])=>`<li><button class="aitem" ${go==='staff'?'data-view="staff"':`data-goto="reports" data-stage="${go}"`}><span class="sev ${s}"></span><span class="t"><b>${t}</b><span>${d}</span></span><span class="n">${n}</span></button></li>`).join('')}</ul>`:`<div class="alert ok">Everything is on track for ${mFull(m)}.</div>`}</div>`;
  // services chart
  const met=S.metric,mm=ms.map(x=>metrics(x));
  const segFor=o=>met==='ses'?[{v:o.sesW,c:'who'},{v:o.sesH,c:'ha'}]:met==='ben'?[{v:o.benW,c:'who'},{v:o.benH,c:'ha'}]:[{v:o.hrs,c:'acc'}];
  const series=mm.map((o,i)=>({label:mLabel(ms[i]).slice(0,3),segs:(S.fund==='all'||met==='hrs')?segFor(o):segFor(o).filter(g=>g.c===(S.fund==='WHO'?'who':'ha')),fut:o.reported===0,sel:ms[i]===m}));
  const tgt=met==='ses'&&S.fund!=='HA'?+cfg().sessionTarget:0;
  const svc=`<div class="card c7"><div class="card-h"><div><h3>Services delivered</h3><p>From approved monthly technical reports</p></div>
    <div class="seg">${[['ses','Sessions'],['ben','Beneficiaries'],['hrs','Hours worked']].map(([k,l])=>`<button data-metric="${k}" aria-pressed="${met===k}">${l}</button>`).join('')}</div></div>
    ${colChart(series,{target:tgt,targetLabel:'WHO target '+fmtN(tgt)+' / month'})}
    <div class="legend" style="margin-top:12px">${met==='hrs'?'<span><span class="dot" style="background:var(--accent)"></span>Hours on timesheets</span>':(S.fund!=='HA'?'<span><span class="dot who"></span>WHO-funded</span>':'')+(S.fund!=='WHO'?`<span><span class="dot ha"></span>${cfg().org}-funded</span>`:'')}<span>Dashed: report not in yet</span></div></div>`;
  const sp=ms.map((x,i)=>{const w=fin(x,'WHO').total,h=fin(x,'HA').total;return{label:mLabel(x).slice(0,3),segs:S.fund==='all'?[{v:w,c:'who'},{v:h,c:'ha'}]:[{v:S.fund==='WHO'?w:h,c:S.fund==='WHO'?'who':'ha'}],fut:w+h===0,sel:x===m,fmt:usdS}});
  const spend=`<div class="card c5"><div class="card-h"><div><h3>Spending by month</h3><p>Salaries + overhead + VAT + other, USD</p></div></div>
    ${colChart(sp,{target:bud/ms.length,targetLabel:'Plan '+usdS(bud/ms.length,0),fmt:v=>'$'+fmtN(v/1000,0)+'k'})}
    <div class="legend" style="margin-top:12px"><span>Remaining: <b class="num" style="color:var(--ink)">${usdS(bud-spent)}</b></span><span>Committed (not yet paid): <b class="num" style="color:var(--ink)">${usdS(fin(m,S.fund).committed)}</b></span></div></div>`;
  return `<div class="vhead"><div><span class="eyebrow">Month ${mi+1} of ${ms.length} · ${periodOf(m)?periodOf(m).label:''}</span><h2>${mFull(m)} payroll</h2></div></div>${kpis}<section class="grid">${funnel}${att}</section><section class="grid">${svc}${spend}</section>${deptTable(m)}`;
}
function periodOf(m){return cfg().periods.find(p=>m>=p.from&&m<=p.to)}
function colChart(series,o){
  const tot=s=>s.segs.reduce((a,b)=>a+b.v,0);const max=Math.max(o.target||0,...series.map(tot))*1.2||1;const f=o.fmt||(v=>fmtN(v));
  return `<div class="cc-wrap"><div class="cc" style="--n:${series.length}">${o.target?`<div class="cc-target" style="bottom:${o.target/max*100}%"><span>${esc(o.targetLabel)}</span></div>`:''}
  ${series.map(s=>{const t=tot(s);return `<div class="cc-col${s.fut?' fut':''}${s.sel?' sel':''}"><span class="cc-val">${s.fut?'':f(t)}</span><div class="cc-stack" style="--h:${s.fut?38:Math.max(1,t/max*100)}%">${s.fut?'':s.segs.map(g=>`<i class="${g.c}" style="flex:${g.v}"></i>`).join('')}</div></div>`}).join('')}
  </div><div class="cc-x" style="--n:${series.length}">${series.map(s=>s.sel?`<b>${s.label}</b>`:`<span>${s.label}</span>`).join('')}</div></div>`}
function deptAgg(m,f=S.fund){const d={};for(const s of fStaff(f)){if(!active(s,m))continue;const x=d[s.dept]||(d[s.dept]={dept:s.dept,n:0,rep:0,att:0,wd:0,hrs:0,ses:0,ben:0,paid:0,cost:0});x.n++;const r=rec(m,s.id);if(stageIdx(r.st)>=1&&r.st!=='returned'){x.rep++;x.att+=+r.att||0;x.wd+=+r.wd||0;x.hrs+=+r.hrs||0;x.ses+=+r.ses||0;x.ben+=+r.ben||0}if(r.st==='paid'){x.paid++;x.cost+=usd(r.amt??s.fee,r.cur||s.currency)}}return Object.values(d).sort((a,b)=>b.n-a.n)}
function deptTable(m){const rows=deptAgg(m);return `<section class="grid"><div class="card c12"><div class="card-h"><div><h3>By department · ${mFull(m)}</h3><p>Attendance from timesheets; sessions and beneficiaries from technical reports</p></div><button class="btn sm" data-view="services">Attendance &amp; services</button></div>
  <div class="tw" style="border:0"><table><thead><tr><th>Department</th><th class="r">Staff</th><th class="r">Reports in</th><th class="r">Attendance</th><th class="r">Hours</th><th class="r">Sessions</th><th class="r">Beneficiaries</th><th class="r">Paid</th><th class="r">Salaries paid</th></tr></thead><tbody>
  ${rows.map(r=>`<tr><td class="nm">${esc(r.dept)}</td><td class="r num">${r.n}</td><td class="r num">${r.rep}</td><td class="r num">${r.wd?Math.round(r.att/r.wd*100)+'%':'—'}</td><td class="r num">${fmtN(r.hrs)}</td><td class="r num">${r.ses?fmtN(r.ses):'—'}</td><td class="r num">${r.ben?fmtN(r.ben):'—'}</td><td class="r num">${r.paid}/${r.n}</td><td class="r num">${usdS(r.cost)}</td></tr>`).join('')||`<tr><td colspan="9" class="empty">No staff yet.</td></tr>`}
  </tbody></table></div></div></section>`}

/* ============ Monthly reports ============ */
function stageMatch(m,s,r){const st=r.st||'pending',L=+cfg().paymentLimitDays||7,t=todayISO();
  switch(S.stage){case'all':return true;case'overdue':return r.rcv&&!['paid','pending','returned'].includes(st)&&L-dDiff(r.rcv,t)<0;
   case'duesoon':{if(!r.rcv||['paid','pending','returned'].includes(st))return false;const l=L-dDiff(r.rcv,t);return l>=0&&l<=2}
   case'missing':return stageIdx(st)>=1&&st!=='returned'&&(!r.tech||!r.ts);default:return st===S.stage}}
function deadline(m,r){const L=+cfg().paymentLimitDays||7;const st=r.st||'pending';
  if(st==='paid'&&r.rcv&&r.paid){const d=dDiff(r.rcv,r.paid);return `<span class="dl ${d<=L?'ok':'bad'}">Paid in ${d} day${d===1?'':'s'}</span>`}
  if(st==='pending'){const due=dueDate(m);return todayISO()>due?`<span class="dl warn">Report late (due ${fmtDs(due)})</span>`:`<span class="dl muted">Due ${fmtDs(due)}</span>`}
  if(st==='returned')return `<span class="dl warn">Back with staff</span>`;
  const left=L-dDiff(r.rcv,todayISO());return left<0?`<span class="dl bad">Overdue ${-left} day${-left===1?'':'s'}</span>`:`<span class="dl ${left<=2?'warn':''}">${left} day${left===1?'':'s'} left</span>`}
function vReports(){
  const m=S.month,M=metrics(m),q=S.q.toLowerCase();
  const list=fStaff().filter(s=>active(s,m));
  const rows=list.filter(s=>{const r=rec(m,s.id);return stageMatch(m,s,r)&&(!q||(s.id+' '+s.name+' '+s.role+' '+s.dept).toLowerCase().includes(q))});
  const ch=[['all','All',M.active],['pending','Awaiting report',M.cnt.pending],['received','Received',M.cnt.received],['verified','Verified',M.cnt.verified],['approved','Approved',M.cnt.approved],['paid','Paid',M.cnt.paid],['returned','Returned',M.cnt.returned],['overdue','Overdue',M.overdue.length],['duesoon','Due in 2 days',M.dueSoon.length],['missing','Missing documents',M.missingDocs.length]];
  [...S.sel].forEach(id=>{if(!rows.some(s=>s.id===id))S.sel.delete(id)});
  const allSel=rows.length&&rows.every(s=>S.sel.has(s.id));
  const selArr=[...S.sel];const selSt=selArr.map(id=>rec(m,id).st||'pending');
  return `<div class="vhead"><div><span class="eyebrow">Deliverables 2 &amp; 3 · receive, verify, approve, pay within ${cfg().paymentLimitDays} days</span><h2>Monthly reports · ${mFull(m)}</h2><p>Each staff member submits a technical report and a timesheet. Track each one from receipt to bank transfer.</p></div>
   <button class="btn" data-dl="register">${IC.dl}Export register (CSV)</button></div>
  <div class="toolbar"><label class="search">${IC.search}<input id="q" placeholder="Search name, ID, role or department" value="${esc(S.q)}" aria-label="Search staff"></label></div>
  <div class="chips" style="margin-bottom:12px">${ch.map(([k,l,n])=>(n||k==='all'||S.stage===k)?`<button class="chip" data-stage="${k}" aria-pressed="${S.stage===k}">${l}<b>${n}</b></button>`:'').join('')}</div>
  <div class="tw"><table><thead><tr><th class="w wr" style="width:34px"><input type="checkbox" data-selall ${allSel?'checked':''} aria-label="Select all"></th><th>Staff</th><th>Role</th><th>Funding</th><th>Documents</th><th class="r">Attendance</th><th class="r">Sessions</th><th class="r">Benef.</th><th>Stage</th><th>Payment deadline</th><th class="r">Amount</th><th class="w"></th></tr></thead><tbody>
  ${rows.map(s=>{const r=rec(m,s.id),st=r.st||'pending',nx=NEXT[st];return `<tr class="click${S.sel.has(s.id)?' selrow':''}" data-rec="${s.id}">
    <td class="w wr" data-stop><input type="checkbox" data-sel="${s.id}" ${S.sel.has(s.id)?'checked':''} aria-label="Select ${esc(s.name)}"></td>
    <td><div class="nm">${esc(s.name)}</div><div class="idc">${s.id}</div></td><td>${esc(s.role)}</td><td><span class="fund ${s.funding}">${s.funding}</span></td>
    <td><span class="docs"><span class="doc ${r.tech?'on':''}" title="Technical report">Report</span><span class="doc ${r.ts?'on':''}" title="Timesheet">Timesheet</span></span></td>
    <td class="r num">${stageIdx(st)>=1?`${r.att??'—'}/${r.wd??workDays(m)}`:'—'}</td><td class="r num">${stageIdx(st)>=1&&r.ses?fmtN(r.ses):'—'}</td><td class="r num">${stageIdx(st)>=1&&r.ben?fmtN(r.ben):'—'}</td>
    <td><span class="st ${st}">${SL[st]}</span></td><td>${deadline(m,r)}</td><td class="r num">${money(r.amt??s.fee,r.cur||s.currency)}</td>
    <td class="w" data-stop>${nx?`<button class="btn sm ${nx==='approved'||nx==='paid'?'wp':'wr'}" data-step="${s.id}">${st==='returned'?'Resubmitted':NL[nx]}</button>`:'<span class="muted" style="font-size:12px">'+(r.ref?esc(r.ref):'')+'</span>'}</td></tr>`}).join('')||`<tr><td colspan="12"><div class="empty"><b>No staff match</b>Try another stage or clear the search.</div></td></tr>`}
  </tbody></table></div>
  ${S.sel.size?`<div class="bulk w"><span><b>${S.sel.size}</b> selected</span>
   ${selSt.some(x=>x==='pending'||x==='returned')?'<button class="btn sm wr" data-bulk="received">Mark received</button>':''}
   ${selSt.some(x=>x==='received')?'<button class="btn sm wr" data-bulk="verified">Verify</button>':''}
   ${selSt.some(x=>x==='verified')?'<button class="btn sm wp" data-bulk="approved">Approve</button>':''}
   ${selSt.some(x=>x==='approved')?'<button class="btn sm wp" data-bulk="paid">Mark paid…</button>':''}
   <button class="btn sm ghost" data-act="clearsel" style="margin-left:auto">Clear</button></div>`:''}`}

/* record drawer */
function openRecord(id,focusPay){
  const m=S.month,s=S.staff[id];if(!s)return;const r=rec(m,id),st=r.st||'pending',L=+cfg().paymentLimitDays||7;
  const stepH=['received','verified','approved','paid'].map(k=>{const i=stageIdx(st),ki=STAGES.indexOf(k);const done=st!=='returned'?i>=ki:(k==='received');const now=NEXT[st]===k;return `<div class="stp ${done?'done':now?'now':''}"><b>${SL[k]}</b><span>${r[DK[k]]?fmtDs(r[DK[k]]):now?'Next':'—'}</span></div>`}).join('');
  const left=r.rcv&&st!=='paid'&&st!=='pending'&&st!=='returned'?L-dDiff(r.rcv,todayISO()):null;
  const fileRow=(k,label)=>{const f=r.files&&r.files[k];return `<div class="filebox"><input type="checkbox" id="r_${k}" ${r[k]?'checked':''} aria-label="${label} received"><span class="t">${label}${f?` · ${f.id?`<a href="/_blob/${esc(f.id)}" target="_blank" rel="noopener">${esc(f.name)}</a>`:`<span class="muted">${esc(f.name)}</span>`}`:' · <span class="muted">no file attached</span>'}</span>
    <label class="btn sm w wu">${IC.up}Attach<input type="file" data-attach="${k}" hidden accept=".pdf,.jpg,.jpeg,.png,.doc,.docx,.xls,.xlsx"></label></div>`};
  const nx=NEXT[st];
  openDrawer(`${s.name}`,`${s.id} · ${s.role} · ${s.funding}-funded · ${mFull(m)}`,`
   ${left!=null?`<div class="alert ${left<0?'bad':left<=2?'warn':'ok'}">${left<0?`Payment is ${-left} day${-left===1?'':'s'} past the ${L}-day limit.`:`${left} day${left===1?'':'s'} left to pay within the ${L}-day limit (received ${fmtDate(r.rcv)}).`}</div>`:''}
   ${st==='returned'&&r.note?`<div class="alert warn"><b>Returned:</b> ${esc(r.note)}</div>`:''}
   <div class="sect"><h4>Progress</h4><div class="steps">${stepH}</div></div>
   <div class="sect"><h4>Documents</h4>${fileRow('tech','Technical report')}${fileRow('ts','Timesheet')}<span class="hint">${S.assets?'Attached files are archived with this record.':'File names are recorded; uploading files needs editor access to this page.'}</span></div>
   <div class="sect"><h4>Attendance (timesheet)</h4><div class="fgrid">
     <div class="field"><label for="r_att">Days attended</label><input class="inp num" id="r_att" type="number" min="0" max="31" value="${r.att??''}"></div>
     <div class="field"><label for="r_wd">Working days</label><input class="inp num" id="r_wd" type="number" min="0" max="31" value="${r.wd??workDays(m)}"></div>
     <div class="field"><label for="r_hrs">Hours</label><input class="inp num" id="r_hrs" type="number" min="0" value="${r.hrs??''}"></div></div></div>
   <div class="sect"><h4>Services (technical report)</h4><div class="fgrid">
     <div class="field"><label for="r_ses">Sessions / procedures</label><input class="inp num" id="r_ses" type="number" min="0" value="${r.ses??''}"></div>
     <div class="field"><label for="r_ben">Beneficiaries</label><input class="inp num" id="r_ben" type="number" min="0" value="${r.ben??''}"></div></div></div>
   <div class="sect" id="paySect"><h4>Payment</h4><div class="fgrid">
     <div class="field"><label for="r_amt">Amount (${s.currency})</label><input class="inp num" id="r_amt" type="number" min="0" step="0.01" value="${r.amt??s.fee}"></div>
     <div class="field"><label for="r_paid">Transfer date</label><input class="inp" id="r_paid" type="date" value="${r.paid||todayISO()}"></div>
     <div class="field"><label for="r_ref">Bank reference</label><input class="inp" id="r_ref" value="${esc(r.ref||'')}" placeholder="e.g. HB-202610-012"></div></div>
     <span class="hint">Agreed fee: ${money(s.fee,s.currency)} · account ending ${esc(s.bank||'—')}</span></div>
   <div class="sect"><h4>Notes</h4><textarea class="inp" id="r_note" placeholder="Verification notes or reason for returning">${esc(r.note||'')}</textarea></div>
   ${(r.hist||[]).length?`<div class="sect"><h4>History</h4><ul class="hist" id="histList">${r.hist.map(h=>`<li><span>${fmtDate(h.at)}</span><b>${SL[h.s]||h.s}</b>${h.by?` <em class="muted">· ${esc((S.logins[h.by]||{}).displayName||h.by)}</em>`:''}</li>`).join('')}</ul></div>`:''}`,
   `<button class="btn w wr danger" data-act="rec-return" ${['pending','returned','paid'].includes(st)?'disabled':''}>Return for correction</button>
    <button class="btn w wr" data-act="rec-save">Save</button>
    ${nx?`<button class="btn primary w ${nx==='approved'||nx==='paid'?'wp':'wr'}" data-act="rec-advance" data-to="${nx}">${st==='returned'?'Mark resubmitted':NL[nx]}${nx==='paid'?'':' & save'}</button>`:''}`,{id,kind:'rec'});
  resolveNames();
  if(focusPay)setTimeout(()=>{const el=$('#r_ref');el&&el.scrollIntoView({block:'center'});el&&el.focus()},350);
}

  const depts=[...new Set(staffList().filter(s=>f==='all'||s.funding===f).map(s=>s.dept))].sort();
  const forecast=(dept)=>{let a=0,fc=0;for(const s of staffList()){if(f!=='all'&&s.funding!==f)continue;if(dept&&s.dept!==dept)continue;for(const m of ms){const r=rec(m,s.id);if(r.st==='paid'){const v=usd(r.amt??s.fee,r.cur||s.currency);a+=v;fc+=v}else if(active(s,m))fc+=usd(s.fee,s.currency)}}return{a,fc}};
  const lines=depts.map(d=>{const b=plannedSalaries(f,d)*(c.budget&&c.budget[f]&&f!=='all'?c.budget[f]/(plannedSalaries(f)*mult()):1),x=forecast(d);return{key:d,label:'Salaries · '+d,b,a:x.a,fc:x.fc}});

  const ohp=(+c.overheadPct||0)/100;lines.push({key:'Overhead',label:`Overhead (${c.overheadPct}%)`,b:salB*ohp,a:T.oh,fc:salF*ohp});
  lines.push({key:'VAT',label:`VAT (${c.vatPct}% on ${c.vatBase==='overhead'?'overhead':'salaries + overhead'})`,b:vatOn(salB,salB*ohp),a:T.vat,fc:vatOn(salF,salF*ohp)});

   ${tile('Remaining',num(bud-T.total,{pre:'$'}),`Forecast at completion ${usdS(lines.reduce((a,l)=>a+l.fc,0))}`)}
  </section>
  <div class="card" style="margin-bottom:16px"><div class="card-h"><div><h3>Monthly financial overview${f==='all'?'':' · '+(f==='WHO'?'WHO':c.org)+'-funded'}</h3><p>${canEditCost?'Enter bank fees and other costs per month in the last columns.':f==='all'?'Choose WHO or '+c.org+' above to enter other costs.':''}</p></div></div>
   <div class="tw" style="border:0"><table><thead><tr><th>Month</th><th class="r">Staff paid</th><th class="r">Paid in USD</th><th class="r">Paid in ILS</th><th class="r">Salaries (USD eq.)</th><th class="r">Overhead</th><th class="r">VAT</th><th class="r">Bank fees</th><th class="r">Other</th><th class="r">Total</th><th class="r">Cumulative</th></tr></thead><tbody>

function reportData(pid,scope){

    const start=s.start>monthStart(pm[0])?s.start:monthStart(pm[0]),end=s.end<monthEnd(pm[pm.length-1])?s.end:monthEnd(pm[pm.length-1]);return{...s,pStart:start,pEnd:end,paid,months,tot}});

  return {p,pm,staff:st,fins,comp,L,scope}}

   box.innerHTML='';list.forEach(h=>{const row=document.createElement('div');row.className='result';const nm=document.createElement('b');nm.textContent=h.name||'Unnamed';const t=document.createElement('div');t.className='t';t.appendChild(nm);
     if(S.members[h.id]){const s2=document.createElement('div');s2.className='hint';s2.textContent='Already has access: '+ROLES[S.members[h.id].role].label;t.appendChild(s2)}
     const av=document.createElement('span');av.className='avatar';av.textContent=initials(h.name);row.append(av,t);
     if(!S.members[h.id]&&h.id!==S.me?.id){const sel=document.createElement('select');sel.className='inp';sel.style.width='auto';sel.innerHTML=Object.entries(ROLES).map(([k,v])=>`<option value="${k}" ${k==='finance'?'selected':''}>${v.label}</option>`).join('');const b=document.createElement('button');b.className='btn sm primary';b.textContent='Add';b.onclick=()=>{S.names[h.id]={name:h.name};saveMembers({[h.id]:{role:sel.value,added:todayISO(),by:S.me?.id||''}});box.innerHTML='<p class="hint">Added. Remember to share the page with them from the Share menu.</p>';$('#userQ').value=''};row.append(sel,b)}
     box.appendChild(row)})}catch(e){box.innerHTML='<p class="hint">Search failed. Try again.</p>'}}

/* ============ drawer / dialog / toast ============ */
let DR=null;
function openDrawer(t,sub,body,foot,ctx){DR=ctx||{};$('#dTitle').textContent=t;$('#dSub').textContent=sub||'';$('#dBody').innerHTML=body;$('#dFoot').innerHTML=foot||'';$('#dBody').scrollTop=0;
  $('#drawer').classList.add('on');$('#drawer').setAttribute('aria-hidden','false');$('#scrim').classList.add('on');setTimeout(()=>{const f=$('#dBody input:not([readonly]):not([type=checkbox]),#dBody textarea');if(f&&matchMedia('(min-width:700px)').matches&&ctx&&ctx.kind==='staff'&&!ctx.id)f.focus()},320)}
function closeDrawer(){DR=null;$('#drawer').classList.remove('on');$('#drawer').setAttribute('aria-hidden','true');$('#scrim').classList.remove('on')}
function confirmBox(title,msg,ok,fn,danger){$('#dlgHost').innerHTML=`<div class="dlg" role="dialog" aria-modal="true"><div class="dlg-bg" data-act="dlg-x"></div><div class="dlg-box"><h3>${esc(title)}</h3><p>${msg}</p><div class="chips" style="justify-content:flex-end"><button class="btn" data-act="dlg-x">Cancel</button><button class="btn ${danger?'danger':'primary'}" id="dlgOk">${esc(ok)}</button></div></div></div>`;
  $('#dlgOk').onclick=()=>{$('#dlgHost').innerHTML='';fn()};$('#dlgOk').focus()}
function toast(msg,kind){const el=document.createElement('div');el.className='toast'+(kind?' '+kind:'');el.textContent=msg;$('#toasts').appendChild(el);setTimeout(()=>el.remove(),3300)}

/* ============ persistence ============ */
const queues={};
function enqueue(key,fn){const p=(queues[key]||Promise.resolve()).then(fn).catch(e=>{console.error(e);
  if(e&&e.code==='invalid_argument'&&S.canWrite==null){S.canWrite=false;render();toast('You have view-only access to this page.','bad')}
  else toast('Could not save: '+(e&&(e.message||e.code)||'unknown error'),'bad')});queues[key]=p;return p}
const live=()=>S.mode==='live'&&S.db;
function writeRecords(m,patches){
  const M=S.months[m]||(S.months[m]={records:{}});M.records=M.records||{};
  for(const id in patches)M.records[id]={...(M.records[id]||{}),...patches[id]};
  render();if(!live())return Promise.resolve();
  return enqueue('months/'+m,async()=>{const ref=S.db.doc('months/'+m);if(S.monthExists[m])await ref.update({records:patches});else{await ref.set(JSON.parse(JSON.stringify(S.months[m])));S.monthExists[m]=true}})}
function writeCosts(m,f,patch){const M=S.months[m]||(S.months[m]={records:{}});M.costs=M.costs||{};M.costs[f]={...(M.costs[f]||{}),...patch};
  if(!live()){render();return}enqueue('months/'+m,async()=>{const ref=S.db.doc('months/'+m);if(S.monthExists[m])await ref.update({costs:{[f]:patch}});else{await ref.set(JSON.parse(JSON.stringify(M)));S.monthExists[m]=true}})}
function writeStaff(map){Object.assign(S.staff,map);render();if(!live())return;
  enqueue('registry/staff',async()=>{const ref=S.db.doc('registry/staff');if(S.registryExists)await ref.update({list:map});else{await ref.set({list:JSON.parse(JSON.stringify(S.staff))});S.registryExists=true}})}
function writeConfig(){render();if(!live())return;enqueue('config/project',()=>S.db.doc('config/project').set(JSON.parse(JSON.stringify(S.config))))}
async function writeAll(data){
  S.staff=data.staff;S.months=data.months||{};S.config={...structuredClone(DEFAULT_CONFIG),...(data.config||{})};
  if(!S.db){render();return}
  S.mode='live';render();
  try{await S.db.doc('config/project').set(JSON.parse(JSON.stringify(S.config)));
    await S.db.doc('registry/staff').set({list:JSON.parse(JSON.stringify(S.staff))});S.registryExists=true;
    for(const m of Object.keys(S.months)){await S.db.doc('months/'+m).set(JSON.parse(JSON.stringify(S.months[m])));S.monthExists[m]=true}
    toast('Saved to the shared database')}catch(e){console.error(e);toast('Could not save: '+(e.message||e.code),'bad')}}

/* ============ downloads ============ */
function csv(rows){return rows.map(r=>r.map(v=>{v=v==null?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')).join('\r\n')}
async function download(name,data){
  const bin=typeof data!=='string';const type=name.endsWith('.pdf')?'application/pdf':'application/octet-stream';
  const d=S.dlP?await S.dlP:null;
  if(d){try{await d.save({filename:name,data:bin?new Blob([data],{type}):data});toast('Saved '+name);return}catch(e){if(e&&e.code==='declined')return;if(e&&e.code==='rate_limited'){toast('A save prompt is already open','bad');return}}}
  if(bin){const blob=new Blob([data],{type});let href=null;
    if(S.assets){try{toast('Preparing '+name+'…');const r=await S.assets.upload(blob);href=r.url}catch(e){console.warn(e)}}
    if(!href)href=URL.createObjectURL(blob);
    openDrawer('Your PDF is ready',name,`<div style="display:grid;gap:14px;justify-items:start"><p style="margin:0">Open the report in a new tab, then use the download or print button in the PDF viewer to save it.</p><a class="btn primary" style="padding:12px 20px;font-size:15px" href="${esc(href)}" target="_blank" rel="noopener" download="${esc(name)}">${IC.dl}Open ${esc(name)}</a></div>`,'',{kind:'dl'});return}
  openDrawer('Copy '+name,'Downloads are not available in this view. Copy the contents instead.',`<textarea class="inp mono" id="dlText" style="min-height:60vh;font-size:12px" readonly>${esc(data)}</textarea>`,`<button class="btn primary" data-act="copy-dl">Copy to clipboard</button>`,{kind:'dl'})}
function doDownload(k){const m=S.month,c=cfg(),ms=monthList(),stamp=todayISO();
  if(k==='register'){const rows=[['Staff ID','Name','Role','Department','Funding','Stage','Technical report','Timesheet','Days attended','Working days','Hours','Sessions','Beneficiaries','Received','Verified','Approved','Paid','Days to pay','Amount','Currency','Bank reference','Note']];
    for(const s of fStaff().filter(s=>active(s,m))){const r=rec(m,s.id);rows.push([s.id,s.name,s.role,s.dept,s.funding,SL[r.st||'pending'],r.tech?'Yes':'No',r.ts?'Yes':'No',r.att,r.wd,r.hrs,r.ses,r.ben,r.rcv,r.ver,r.app,r.paid,r.rcv&&r.paid?dDiff(r.rcv,r.paid):'',r.amt??s.fee,r.cur||s.currency,r.ref,r.note])}
    return download(`wafaa-register-${m}.csv`,csv(rows))}
  if(k==='staff'||k==='template'){const rows=[['id','name','role','department','funding','currency','fee','start','end','bank_last4']];if(k==='staff')for(const s of fStaff())rows.push([s.id,s.name,s.role,s.dept,s.funding,s.currency,s.fee,s.start,s.end,s.bank]);else rows.push(['WF-001','Full Name','Physiotherapist','Rehabilitation','WHO','USD','950','2026-08-01','2026-12-31','1234']);return download(k==='staff'?`wafaa-staff-${stamp}.csv`:'wafaa-staff-template.csv',csv(rows))}
  if(k==='services'){const rows=[['Month','Department','Staff','Reports in','Attendance %','Hours','Sessions','Beneficiaries']];for(const x of ms)for(const r of deptAgg(x))rows.push([mLabel(x),r.dept,r.n,r.rep,r.wd?(r.att/r.wd*100).toFixed(1):'',r.hrs,r.ses,r.ben]);return download(`wafaa-services-${stamp}.csv`,csv(rows))}
  if(k==='fin'||k==='rfin'){const f=k==='fin'?S.ffund:S.scope;const mm=k==='fin'?ms:periodMonths(c.periods.find(p=>p.id===S.period));const rows=[['Month','Funding','Staff paid','Paid in USD','Paid in ILS','Salaries (USD eq.)','Overhead','VAT','Other costs','Total (USD)']];
    for(const x of mm){const r=fin(x,f);rows.push([mFull(x),f,r.n,r.usdN.toFixed(2),r.ils.toFixed(2),r.sal.toFixed(2),r.oh.toFixed(2),r.vat.toFixed(2),r.other.toFixed(2),r.total.toFixed(2)])}return download(`wafaa-financials-${f}-${stamp}.csv`,csv(rows))}
  if(k==='rstaff'){const d=reportData(S.period,S.scope);const rows=[['Name','Role / function','Funding','Contract start','Contract end','Months paid','Paid (USD eq.)']];for(const s of d.staff)rows.push([s.name,s.role,s.funding,s.start,s.end,s.paid+'/'+s.months,s.tot.toFixed(2)]);return download(`who-staff-${S.period}-${stamp}.csv`,csv(rows))}
  if(k==='report'){const d=reportData(S.period,S.scope);let buf;try{buf=buildPDF(d)}catch(e){console.error(e);toast('Could not build the PDF: '+e.message,'bad');return}return download(`WHO-report-${S.period}-${S.scope==='all'?'all-staff':S.scope}-${stamp}.pdf`,buf)}
  if(k==='backup')return download(`wafaa-backup-${stamp}.json`,JSON.stringify({version:1,exported:stamp,config:S.config,staff:S.staff,months:S.months},null,1))}

function hexRgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');return [0,2,4].map(i=>parseInt(h.slice(i,i+2),16))}
const pdfT=v=>String(v??'').replace(/₪/g,'ILS ').replace(/[–—]/g,'-').replace(/−/g,'-').replace(/≤/g,'<=').replace(/[^\x00-\xFF]/g,'');
function buildPDF(d){
  if(!window.jspdf||!window.jspdf.jsPDF)throw new Error('PDF library did not load; check your connection and reload');
  const c=cfg(),b=brand(),B=hexRgb(b.primary),G=hexRgb(b.gold);const {jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:'landscape',unit:'pt',format:'a4',compress:true});const W=doc.internal.pageSize.getWidth(),H=doc.internal.pageSize.getHeight(),M=36;
  // white header with logo
  doc.setFillColor(255,255,255);doc.rect(0,0,W,100,'F');
  const logo=b.logo||HA_LOGO_PNG;let lw=0;try{const p=doc.getImageProperties(logo);const h=48;lw=Math.min(150,p.width/p.height*h);doc.addImage(logo,'PNG',W-M-lw,26,lw,lw/(p.width/p.height))}catch(e){console.warn(e)}
  doc.setTextColor(65,64,66);doc.setFont('helvetica','bold');doc.setFontSize(21);doc.text('Consolidated Report to WHO',M,44);
  doc.setFont('helvetica','normal');doc.setFontSize(10.5);doc.setTextColor(...B);doc.text(pdfT('Salary / incentive payment support  |  '+c.hospital),M,63);
  doc.setTextColor(110,114,118);doc.setFontSize(9.5);doc.text(pdfT(`Reporting period: ${d.p.label}   |   Scope: ${d.scope==='all'?'All staff':d.scope+'-funded staff'}   |   Contractor: ${c.org}   |   Prepared: ${fmtDate(todayISO())}`),M,80);
  doc.setFillColor(...B);doc.rect(M,94,W-2*M-90,3,'F');doc.setFillColor(...G);doc.rect(W-M-90,94,90,3,'F');
  let y=124;
  // summary boxes
  const T=d.fins.reduce((a,r)=>{for(const k of['n','usdN','ils','sal','oh','vat','other','total'])a[k]=(a[k]||0)+r[k];return a},{});
  const C=d.comp.reduce((a,r)=>{a.rcvd+=r.rcvd;a.paid+=r.paid;a.onTime+=r.onTime;a.ses+=r.ses;a.ben+=r.ben;return a},{rcvd:0,paid:0,onTime:0,ses:0,ben:0});
  const boxes=[['Staff contracted',String(d.staff.length)],['Total expenditure',pdfT(usdS(T.total||0))],[`Paid within ${d.L} days`,C.paid?Math.round(C.onTime/C.paid*100)+'%':'-'],['Sessions delivered',fmtN(C.ses)],['Beneficiaries',fmtN(C.ben)]];
  const bw=(W-2*M-4*12)/5;boxes.forEach(([l,v],i)=>{const x=M+i*(bw+12);doc.setFillColor(246,247,249);doc.roundedRect(x,y,bw,54,6,6,'F');doc.setFillColor(...G);doc.rect(x,y+8,3,38,'F');doc.setTextColor(100,110,120);doc.setFontSize(8.5);doc.setFont('helvetica','normal');doc.text(l.toUpperCase(),x+14,y+20);doc.setTextColor(65,64,66);doc.setFont('helvetica','bold');doc.setFontSize(16);doc.text(v,x+14,y+42)});
  y+=80;
  const R={halign:'right'};
  const section=(title,head,body,foot,colStyles,note)=>{if(y>H-120){doc.addPage();y=50}
    doc.setTextColor(65,64,66);doc.setFont('helvetica','bold');doc.setFontSize(12.5);doc.text(title,M,y);doc.setFillColor(...G);doc.rect(M,y+5,40,2,'F');
    const rightCols=Object.keys(colStyles||{}).filter(k=>colStyles[k].halign==='right').map(Number);const tx=v=>v&&typeof v==='object'?{...v,content:pdfT(v.content)}:pdfT(v);
    doc.autoTable({startY:y+14,margin:{left:M,right:M,top:50,bottom:44},head:[head.map(pdfT)],body:body.map(r=>r.map(tx)),foot:foot?[foot.map(tx)]:undefined,showFoot:'lastPage',showHead:'everyPage',theme:'plain',rowPageBreak:'avoid',
      didParseCell:h=>{if(rightCols.includes(h.column.index))h.cell.styles.halign='right';if(h.section!=='body'){h.cell.styles.overflow='visible';h.cell.styles.cellWidth=h.cell.styles.cellWidth}},
      styles:{font:'helvetica',fontSize:8.5,cellPadding:{top:5,bottom:5,left:6,right:6},textColor:[30,38,46],lineColor:[226,231,236],lineWidth:{bottom:.5}},
      headStyles:{fillColor:B.map(v=>Math.round(v*.78)),textColor:[255,255,255],fontStyle:'bold',fontSize:8.5},footStyles:{fillColor:[233,242,236],textColor:[20,28,36],fontStyle:'bold'},
      alternateRowStyles:{fillColor:[248,249,251]},columnStyles:colStyles||{}});
    y=doc.lastAutoTable.finalY+(note?14:30);if(note){doc.setFont('helvetica','italic');doc.setFontSize(8);doc.setTextColor(110,118,126);doc.text(pdfT(note),M,y,{maxWidth:W-2*M});y+=26}};
  section('1. Staff contracted during the reporting period',['#','Name','Role / function','Funding','Contract start','Contract end','Months paid','Paid (USD eq.)'],
    d.staff.map((s,i)=>[i+1,s.name,s.role,s.funding,fmtDate(s.start),fmtDate(s.end),s.paid+' / '+s.months,usdS(s.tot)]),
    [{content:`Total: ${d.staff.length} staff`,colSpan:6},`${d.staff.reduce((a,s)=>a+s.paid,0)} payments`,usdS(d.staff.reduce((a,s)=>a+s.tot,0))],{0:{cellWidth:26},6:R,7:R});
  section('2. Financial overview by month',['Month','Staff paid','Paid in USD','Paid in ILS','Salaries (USD eq.)',`Overhead (${c.overheadPct}%)`,`VAT (${c.vatPct}%)`,'Other costs','Total (USD)'],
    d.fins.map(r=>[mFull(r.m),r.n,usdS(r.usdN),ilsS(r.ils),usdS(r.sal),usdS(r.oh),usdS(r.vat),usdS(r.other),usdS(r.total)]),
    ['Total',T.n||0,usdS(T.usdN||0),ilsS(T.ils||0),usdS(T.sal||0),usdS(T.oh||0),usdS(T.vat||0),usdS(T.other||0),usdS(T.total||0)],{1:R,2:R,3:R,4:R,5:R,6:R,7:R,8:R},
    `ILS payments converted at ILS ${c.fx} per USD 1. VAT applied to ${c.vatBase==='overhead'?'the overhead fee':'salaries and overhead'}. Other costs include bank transfer fees.`);
  section('3. Report approval and payment timeliness',['Month','Staff under contract','Reports received','Paid',`Paid within ${d.L} days`,'Avg. days to payment'],
    d.comp.map(r=>[mFull(r.m),r.active,r.rcvd,r.paid,r.paid?Math.round(r.onTime/r.paid*100)+'%':'-',r.avg==null?'-':r.avg.toFixed(1)]),
    ['Period total','',C.rcvd,C.paid,C.paid?Math.round(C.onTime/C.paid*100)+'%':'-',''],{1:R,2:R,3:R,4:R,5:R});
  section('4. Services delivered',['Month','Attendance rate','Sessions / procedures','Beneficiaries'],
    d.comp.map(r=>[mFull(r.m),r.att==null?'-':(r.att*100).toFixed(1)+'%',fmtN(r.ses),fmtN(r.ben)]),[{content:'Period total',colSpan:2},fmtN(C.ses),fmtN(C.ben)],{1:R,2:R,3:R},
    'Monthly technical reports and timesheets for each staff member are archived and available on request.');
  const n=doc.getNumberOfPages();for(let i=1;i<=n;i++){doc.setPage(i);doc.setDrawColor(...G);doc.setLineWidth(.6);doc.line(M,H-30,W-M,H-30);doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(120,128,136);
    doc.text(pdfT(`${c.org}  |  ${c.hospital}  |  WHO consolidated report, ${d.p.label}`),M,H-17);doc.text(`Page ${i} of ${n}`,W-M,H-17,{align:'right'})}
  return doc.output('arraybuffer')}
async function toLogo(file){const url=URL.createObjectURL(file);try{const img=new Image();await new Promise((r,j)=>{img.onload=r;img.onerror=()=>j(new Error('That image could not be read'));img.src=url});
  let w=img.naturalWidth||600,h=img.naturalHeight||200;const s=Math.min(1,600/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);let out=cv.toDataURL('image/png');
  if(out.length>180000){const s2=Math.sqrt(180000/out.length);cv.width=Math.round(w*s2);cv.height=Math.round(h*s2);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);out=cv.toDataURL('image/png')}return out}finally{URL.revokeObjectURL(url)}}

function parseCSV(t){const rows=[];let r=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else{if(c==='"')q=true;else if(c===','||c===';'&&!t.includes(',')){r.push(f);f=''}else if(c==='\n'){r.push(f);rows.push(r);r=[];f=''}else if(c!=='\r')f+=c}}if(f||r.length){r.push(f);rows.push(r)}return rows.filter(x=>x.some(v=>v.trim()))}
function normDate(v){v=(v||'').trim();if(/^\d{4}-\d{2}-\d{2}$/.test(v))return v;const m=v.match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{4})$/);return m?`${m[3]}-${pad(m[2])}-${pad(m[1])}`:''}
function importStaffText(text){const rows=parseCSV(text.replace(/^﻿/,''));if(rows.length<2){toast('The file has no data rows','bad');return}
  const h=rows[0].map(x=>x.trim().toLowerCase().replace(/[^a-z0-9]+/g,'_'));const ix=k=>h.findIndex(x=>k.includes(x));
  const I={id:ix(['id','staff_id']),name:ix(['name','full_name']),role:ix(['role','function','role_function']),dept:ix(['department','dept']),fund:ix(['funding','funder']),cur:ix(['currency','cur']),fee:ix(['fee','monthly_fee','salary','amount']),start:ix(['start','start_date','contract_start']),end:ix(['end','end_date','contract_end']),bank:ix(['bank_last4','bank','account'])};
  if(I.name<0||I.fee<0){toast('Missing columns: the file needs at least name and fee','bad');return}
  const map={},errs=[];let n=0,base=0;for(const id in S.staff){const k=parseInt(id.replace(/\D/g,''),10);if(k>base)base=k}
  rows.slice(1).forEach((r,i)=>{const g=k=>I[k]>=0?(r[I[k]]||'').trim():'';const fund=g('fund').toUpperCase()==='WHO'?'WHO':'HA';const cur=g('cur').toUpperCase().startsWith('IL')||g('cur')==='₪'||g('cur').toUpperCase()==='NIS'?'ILS':'USD';const fee=parseFloat(g('fee').replace(/[^\d.]/g,''));
    if(!g('name')||!(fee>0)){errs.push(i+2);return}const id=g('id')||('WF-'+String(base+(++n)).padStart(3,'0'));
    map[id]={...(S.staff[id]||{}),id,name:g('name'),role:g('role')||'—',dept:g('dept')||'General',funding:fund,currency:cur,fee,start:normDate(g('start'))||monthStart(monthList()[0]),end:normDate(g('end'))||monthEnd(monthList().slice(-1)[0]),bank:g('bank').slice(-4),active:true}});
  const ids=Object.keys(map),upd=ids.filter(id=>S.staff[id]&&S.mode==='live').length;const w=ids.filter(id=>map[id].funding==='WHO').length;
  confirmBox('Import staff list',`${ids.length} staff found (${w} WHO-funded, ${ids.length-w} ${esc(cfg().org)}-funded).${S.mode==='live'?` ${ids.length-upd} new, ${upd} updated.`:' This replaces the sample data and starts the shared database.'}${errs.length?` <br><b>${errs.length} rows skipped</b> (missing name or fee): line ${errs.slice(0,8).join(', ')}${errs.length>8?'…':''}.`:''}`,'Import',()=>{
    if(S.mode==='live')writeStaff(map);else writeAll({staff:map,months:{},config:S.config});S.view='staff';S.anim=true;location.hash='staff';render()})}

  const p={};ids.forEach(id=>p[id]=advancePatch(m,id,to));writeRecords(m,p);S.sel.clear();toast(`${ids.length} marked ${SL[to].toLowerCase()}`);render()}

  case'reset-pass':confirmBox('Reset your password?','You are already signed in with your own account, so you can create a new password now. Your data is not affected.','Reset password',async()=>{try{const prof={...S.profile,passHash:null,salt:null};await profRef().set(prof);S.profile=prof;renderGate()}catch(e){toast('Could not reset: '+(e.message||e.code),'bad')}});break;
  case'rename':{const v=($('#myName')||{}).value;if(!v||!v.trim())return;const prof={...(S.profile||{}),displayName:v.trim()};S.profile=prof;render();if(profRef())profRef().set(prof).then(()=>toast('Name updated')).catch(e=>toast('Could not save: '+(e.message||e.code),'bad'));if(S.isOwner&&S.db)S.db.doc('access/members').get().then(sn=>sn.exists?S.db.doc('access/members').update({ownerName:v.trim()}):S.db.doc('access/members').set({members:{},ownerName:v.trim()})).catch(()=>{});break}

  case'request-access':if(!S.db||!S.me)return;S.db.doc('requests/'+S.me.id).set({at:todayISO(),name:myName()}).then(()=>{S.requests[S.me.id]={at:todayISO()};renderGate()}).catch(e=>toast('Could not send the request: '+(e.message||e.code),'bad'));break;
  case'approve-req':{const id=t.dataset.id;const role=($('#rq_'+id)||{}).value||'viewer';saveMembers({[id]:{role,added:todayISO(),by:S.me?.id||''}});S.db&&S.db.doc('requests/'+id).delete().catch(()=>{});delete S.requests[id];break}
  case'deny-req':{const id=t.dataset.id;delete S.requests[id];S.db&&S.db.doc('requests/'+id).delete().catch(()=>{});render();toast('Request dismissed');break}
  case'remove-member':{const id=t.dataset.id;confirmBox('Remove access?',`${esc(nameOf(id))} will no longer have a role in this workspace. To block the page completely, also remove them in the Share menu.`,'Remove',()=>saveMembers({},id),true);break}

  case'rec-save':case'rec-advance':case'rec-return':{const id=DR.id,f=readRecForm(),r=rec(m,id);let p={...f};

    if(a==='rec-advance'){const to=t.dataset.to;const extra={date:to==='paid'?$('#r_paid').value||todayISO():todayISO(),ref:$('#r_ref').value.trim(),amt:f.amt};if(to==='paid'&&!extra.ref){toast('Enter the bank reference','bad');$('#r_ref').focus();return}p={...p,...advancePatch(m,id,to,extra)};if(to==='received'){p.tech=f.tech||(!r.tech&&!r.ts)?true:f.tech;p.ts=f.ts||(!r.tech&&!r.ts)?true:f.ts;delete p.note;if(r.st!=='returned')p.note=f.note}}

    writeRecords(m,{[id]:p});toast(a==='rec-save'?'Saved':`${S.staff[id].name}: ${SL[p.st]}`);closeDrawer();break}
  case'bulk-pay':{const ids=DR.ids,date=$('#b_date').value||todayISO(),ref=$('#b_ref').value.trim();if(!ref){toast('Enter the batch reference','bad');return}const p={};ids.forEach(id=>p[id]=advancePatch(m,id,'paid',{date,ref:ref+'-'+id.replace(/\D/g,'')}));writeRecords(m,p);S.sel.clear();closeDrawer();toast(`${ids.length} payments marked paid`);break}
  case'add-staff':openStaff(null);break;
  case'staff-save':{const v=k=>$('#'+k).value.trim();const id=v('s_id');if(!id||!v('s_name')||!v('s_role')||!v('s_dept')||!(+v('s_fee')>0)||!v('s_start')||!v('s_end')){toast('Fill in all required fields','bad');return}

  case'import-staff':$('#fileStaff').click();break;

  }}

/* ============ username + password sign-in (overrides) ============ */
const keyOf=u=>String(u||'').trim().toLowerCase().replace(/[^a-z0-9._-]/g,'');
roleOf=function(){if(!window.claude||!window.claude.use||!S.db)return 'admin';const l=S.logins[S.login];return l&&ROLES[l.role]?l.role:null};
myName=function(){const l=S.logins[S.login];return (l&&l.displayName)||(S.login?S.login.toUpperCase():'')};
function genPass(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ',a='abcdefghijkmnpqrstuvwxyz',d='23456789',y='#@%&*!?';const r=n=>crypto.getRandomValues(new Uint32Array(1))[0]%n;const pk=s=>s[r(s.length)];
  const c=[pk(A),pk(A),pk(A),pk(a),pk(a),pk(a),pk(a),pk(d),pk(d),pk(d),pk(y),pk(y),pk(a),pk(A),pk(d),pk(a)];for(let i=c.length-1;i>0;i--){const j=r(i+1);[c[i],c[j]]=[c[j],c[i]]}return c.join('')}
async function makeCred(pw){const salt=Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>b.toString(16).padStart(2,'0')).join('');return {salt,hash:await hashPass(pw,salt)}}
async function saveLogins(next){S.logins=next;render();if(!S.db)return true;const doc={...(S.accessDoc||{members:{}}),logins:JSON.parse(JSON.stringify(next))};
  try{await S.db.doc('access/members').set(doc);S.accessDoc=doc;return true}catch(e){console.error(e);toast(e&&e.code==='invalid_argument'?'Only the owner or an Editor of this page can change accounts':'Could not save: '+(e.message||e.code),'bad');return false}}

  if(!S.db){body.innerHTML=`<div class="alert warn">Sign in to claude.ai with the account this workspace was shared with, then reload.</div>`;return}

    ${setup?'':'<p class="hint" style="margin:0;text-align:center">Forgot your password? Ask an administrator to reset it.</p>'}</form>`;
  setTimeout(()=>{const e=$(S.lastUser?'#g_pw':'#g_user');e&&e.focus()},60)};
gateSubmit=async function(){const msg=$('#gateMsg');const say=t=>{msg.textContent=t;msg.hidden=false};
  if(Date.now()<S.lockUntil){say('Too many attempts. Wait '+Math.ceil((S.lockUntil-Date.now())/1000)+' seconds.');return}
  const k=keyOf($('#g_user').value),pw=$('#g_pw').value;if(!k){say('Enter your username.');return}
  if(!Object.keys(S.logins).length){const nm=$('#g_name').value.trim(),pw2=$('#g_pw2').value;if(!nm){say('Enter a display name.');return}if(pw.length<8){say('Use at least 8 characters.');return}if(pw!==pw2){say('The two passwords do not match.');return}
    const cr=await makeCred(pw);if(!(await saveLogins({[k]:{displayName:nm,role:'admin',...cr,created:todayISO()}})))return;S.login=k;try{sessionStorage.setItem('wafaa-login',k)}catch(e){}enterWorkspace();return}
  const l=S.logins[k];const ok=l&&l.salt&&(await hashPass(pw,l.salt))===l.hash;
  if(!ok){S.fails++;if(S.fails>=5){S.lockUntil=Date.now()+30000;S.fails=0}say('Incorrect username or password.');$('#g_pw').value='';$('#g_pw').focus();return}
  S.fails=0;S.login=k;S.lastUser=k;try{sessionStorage.setItem('wafaa-login',k);localStorage.setItem('wafaa-last-user',k)}catch(e){}enterWorkspace()};
