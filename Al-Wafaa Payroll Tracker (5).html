  c.innerHTML=`<span class="avatar">${esc(initials(n))}</span><span style="text-align:left"><b>${esc(n)}</b><small>${ROLES[S.role].label} · Lock</small></span>`};
vUsers=function(){
  const accs=Object.entries(S.logins).sort((a,b)=>a[0].localeCompare(b[0]));
  const roleSel=(k,cur)=>`<select class="inp" style="width:auto" data-lrole="${esc(k)}" aria-label="Role" ${k===S.login?'disabled':''}>${Object.entries(ROLES).map(([r,v])=>`<option value="${r}" ${r===cur?'selected':''}>${v.label}</option>`).join('')}</select>`;
  return `<div class="vhead"><div><span class="eyebrow">Security</span><h2>Users &amp; access</h2><p>Create a username and password for each colleague and choose what they can do.</p></div></div>
  <section class="grid"><form class="card c7" id="newAcc"><div class="card-h"><div><h3>Add an account</h3><p>Give the username and password to your colleague privately.</p></div></div>
   <div class="fgrid"><div class="field"><label for="na_user">Username</label><input class="inp" id="na_user" autocapitalize="none" required placeholder="e.g. sara"></div>
   <div class="field"><label for="na_name">Display name</label><input class="inp" id="na_name" required placeholder="e.g. Sara Hamdan"></div>
   <div class="field"><label for="na_role">Role</label><select class="inp" id="na_role">${Object.entries(ROLES).map(([r,v])=>`<option value="${r}" ${r==='finance'?'selected':''}>${v.label}</option>`).join('')}</select></div>
   <div class="field"><label for="na_pw">Password</label><div style="display:flex;gap:6px"><input class="inp mono" id="na_pw" required minlength="8"><button class="btn sm" type="button" data-act="gen-pass" data-for="na_pw">Generate</button></div></div></div>
   <div style="margin-top:14px"><button class="btn primary" type="submit">${IC.plus}Create account</button></div></form>
  <div class="card c5"><div class="card-h"><h3>How access is protected</h3></div>
   <ol style="margin:0;padding-left:18px;display:grid;gap:8px;font-size:13.5px"><li><b>Only invited accounts can open the page.</b> Share it from the Share menu first; nobody else can reach it.</li><li><b>Username and password</b> are then required to enter. Passwords are never stored, only an encrypted fingerprint.</li><li><b>Roles</b> decide which buttons each person sees. Five wrong attempts lock sign-in for 30 seconds.</li></ol></div></section>
  <div class="card" style="margin-bottom:16px"><div class="card-h"><h3>Accounts <span class="tag ok">${accs.length}</span></h3></div><div class="tw" style="border:0"><table style="min-width:640px"><thead><tr><th>Username</th><th>Display name</th><th>Role</th><th>Created</th><th></th></tr></thead><tbody>
   ${accs.map(([k,l])=>`<tr><td class="mono">${esc(k)}${k===S.login?' <span class="tag ok">you</span>':''}</td><td><b>${esc(l.displayName||'')}</b></td><td>${roleSel(k,l.role)}</td><td class="muted">${fmtDate(l.created)}</td><td class="r" style="white-space:nowrap"><button class="btn sm" data-act="reset-acc" data-id="${esc(k)}">${k===S.login?'Change my password':'Reset password'}</button> ${k===S.login?'':`<button class="btn sm danger" data-act="remove-acc" data-id="${esc(k)}">Remove</button>`}</td></tr>`).join('')}
  </tbody></table></div></div>
  <div class="card"><div class="card-h"><h3>What each role can do</h3></div><div class="tw" style="border:0"><table class="matrix" style="min-width:620px"><thead><tr><th>Permission</th>${Object.values(ROLES).map(r=>`<th>${r.label}</th>`).join('')}</tr></thead><tbody>
   ${PLIST.map(([p,l])=>`<tr><td>${l}</td>${Object.keys(ROLES).map(r=>`<td>${p==='export'||PERMS[r].includes(p)?'<span class="yes">✓</span>':'<span class="no">—</span>'}</td>`).join('')}</tr>`).join('')}
  </tbody></table></div></div>`};
document.addEventListener('submit',async e=>{if(e.target.id!=='newAcc')return;e.preventDefault();if(!can('users'))return;
  const k=keyOf($('#na_user').value),nm=$('#na_name').value.trim(),role=$('#na_role').value,pw=$('#na_pw').value;
  if(!k){toast('Use letters and numbers for the username','bad');return}if(S.logins[k]){toast('That username already exists','bad');return}if(pw.length<8){toast('Use a password of at least 8 characters','bad');return}
  const cr=await makeCred(pw);if(await saveLogins({...S.logins,[k]:{displayName:nm||k,role,...cr,created:todayISO()}})){
    openDrawer('Account created',`${nm} · ${ROLES[role].label}`,`<p style="margin:0">Send these sign-in details to ${esc(nm)} privately. The password is shown only now.</p><dl class="kv" style="font-size:15px"><dt>Username</dt><dd class="mono">${esc(k)}</dd><dt>Password</dt><dd class="mono" id="newPw">${esc(pw)}</dd></dl><div class="alert warn">Also share the page with them from the Share menu, or they will not be able to open it.</div>`,`<button class="btn primary" data-act="copy-cred" data-u="${esc(k)}">Copy details</button>`,{kind:'cred'})}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.lrole&&can('users')){const k=t.dataset.lrole;saveLogins({...S.logins,[k]:{...S.logins[k],role:t.value}}).then(ok=>ok&&toast('Role updated'))}});
document.addEventListener('click',async e=>{const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act;
  if(a==='gen-pass'){const el=$('#'+t.dataset.for);if(el)el.value=genPass()}
  else if(a==='copy-cred'){const txt=`Al-Wafaa Staff & Payments\nUsername: ${t.dataset.u}\nPassword: ${$('#newPw').textContent}`;try{await navigator.clipboard.writeText(txt);toast('Copied')}catch(_){toast('Select the text and copy it','bad')}}
  else if(a==='remove-acc'&&can('users')){const k=t.dataset.id;confirmBox('Remove account?',`${esc((S.logins[k]||{}).displayName||k)} will no longer be able to sign in.`,'Remove',()=>{const n={...S.logins};delete n[k];saveLogins(n).then(ok=>ok&&toast('Account removed'))},true)}
  else if(a==='reset-acc'&&(can('users'))){const k=t.dataset.id;openDrawer(k===S.login?'Change my password':'Reset password',`${(S.logins[k]||{}).displayName||k} · ${k}`,`<form id="rpForm" style="display:grid;gap:12px"><div class="field"><label for="rp_pw">New password</label><div style="display:flex;gap:6px"><input class="inp mono" id="rp_pw" minlength="8" required><button class="btn sm" type="button" data-act="gen-pass" data-for="rp_pw">Generate</button></div></div><span class="hint">At least 8 characters. Write it down before saving.</span></form>`,`<button class="btn primary" data-act="save-reset" data-id="${esc(k)}">Save new password</button>`,{kind:'reset'})}
  else if(a==='save-reset'&&can('users')){const k=t.dataset.id,pw=$('#rp_pw').value;if(pw.length<8){toast('Use at least 8 characters','bad');return}const cr=await makeCred(pw);if(await saveLogins({...S.logins,[k]:{...S.logins[k],...cr}})){closeDrawer();toast('Password updated')}}
  else if(a==='lock'){S.login=null;try{sessionStorage.removeItem('wafaa-login')}catch(_){}}});
try{S.lastUser=localStorage.getItem('wafaa-last-user')||''}catch(e){}
VIEWS.users[1]=vUsers;

/* ============ boot ============ */
(function boot(){
  const h=(location.hash||'').slice(1);if(VIEWS[h])S.view=h;
  const smp=buildSample();S.staff=smp.staff;S.months=smp.months;S.config=smp.config;S.month=defaultMonth();
  render();renderGate();
  if(!window.claude||!window.claude.use)return;
  const gateTimer=setTimeout(()=>{if(!S.userReady){S.userReady=true;renderGate()}if(!S.dbAccessReady){S.dbAccessReady=true;renderGate()}},11000);
  S.dlP=window.claude.use('downloads').catch(()=>null);
  window.claude.use('assets').then(a=>{S.assets=a;}).catch(()=>{});
  window.claude.use('user').then(async u=>{if(!u){S.userReady=true;renderGate();return}S.user=u;try{S.uid=await u.id()}catch(e){}
    try{S.me=await u.me();if(S.me&&!S.me.id)S.me={...S.me,id:S.uid}}catch(e){S.me=S.uid?{id:S.uid,name:''}:null}try{S.isOwner=!!(await u.isOwner())}catch(e){}S.userReady=true;
    renderGate();try{const c=await u.can('data.write');if(c===false){S.canWrite=false}else if(c===true)S.canWrite=true;else S.canWrite=null}catch(e){S.canWrite=null}render()}).catch(()=>{});
  window.claude.use('db').then(db=>{if(!db){S.dbAccessReady=true;renderGate();render();return}S.db=db;
    let gotM=false,gotR=false;const accReady=()=>{if(gotM&&gotR){S.dbAccessReady=true;try{const k=sessionStorage.getItem('wafaa-login');if(!S.entered&&k&&S.logins[k]){S.login=k;S.role=roleOf();S.entered=!!S.role}}catch(e){}renderGate();render();loadNames()}};
    db.doc('access/members').onSnapshot(sn=>{S.membersExist=sn.exists;S.members=sn.exists?JSON.parse(JSON.stringify((sn.data()||{}).members||{})):{};S.ownerName=sn.exists?(sn.data()||{}).ownerName||'':'';S.logins=sn.exists?JSON.parse(JSON.stringify((sn.data()||{}).logins||{})):{};S.accessDoc=sn.exists?JSON.parse(JSON.stringify(sn.data()||{})):null;gotM=true;accReady()},e=>{gotM=true;accReady()});
    db.collection('requests').onSnapshot(q=>{const o={};q.docs.forEach(d=>o[d.id]=d.data());S.requests=o;gotR=true;accReady()},e=>{gotR=true;accReady()});
    let got={reg:false,cfg:false,mon:false};const ready=()=>{if(got.reg&&got.cfg&&got.mon){S.dbReady=true;render()}};
    let liveCfg=null,liveMonths={};
    const apply=()=>{if(S.registryExists){S.mode='live';if(liveCfg)S.config={...structuredClone(DEFAULT_CONFIG),...liveCfg};S.months=liveMonths}render()};
    db.doc('config/project').onSnapshot(s=>{liveCfg=s.exists?s.data():null;got.cfg=true;ready();apply()},err=>console.warn(err));
    db.collection('months').onSnapshot(q=>{const o={};q.docs.forEach(d=>{o[d.id]=JSON.parse(JSON.stringify(d.data()));S.monthExists[d.id]=true});liveMonths=o;got.mon=true;ready();apply()},err=>console.warn(err));
    db.doc('registry/staff').onSnapshot(s=>{got.reg=true;if(s.exists){S.registryExists=true;const l=(s.data()||{}).list||{};S.staff=JSON.parse(JSON.stringify(l));if(S.mode!=='live')S.anim=true}ready();apply()},err=>console.warn(err));
  }).catch(()=>{S.dbAccessReady=true;renderGate();render()});
})();
</script>

</body></html>
